name: Deploy

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag(commit id) to be deployed'
        required: false
      environment:
        description: "Deploy stack environment"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - prod
      skip-migration:
        required: false
        default: 'false'
        description: 'Set true to skip migration on deploy'

jobs:
  deploy:
    uses: suitepad-gmbh/github-actions/.github/workflows/task-definition-deploy.yml@main
    # permissions:
    #   id-token: write
    #   contents: read
    with:
      image-tag: ${{ github.event.inputs.image-tag }}
      image-uri: 679406978390.dkr.ecr.eu-central-1.amazonaws.com/kim
      service-name: kim
      services: '{ "include": [] }'
      cluster: ecs-main-${{ github.event.inputs.environment }}
      environment: ${{ github.event.inputs.environment }}

    secrets:
      pat-github: ${{ secrets.PAT_GITHUB }}
      aws-access-key-id: ${{ secrets.ECR_SHARED_AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.ECR_SHARED_AWS_SECRET_ACCESS_KEY }}
      staging-aws-deploy-role: ${{ secrets.STAGING_AWS_DEPLOY_ROLE }}
      production-aws-deploy-role: ${{ secrets.PRODUCTION_AWS_DEPLOY_ROLE }}
      staging-ecs-template-bucket: ${{ secrets.S3_STAGING_TEMPLATES }}
      production-ecs-template-bucket: ${{ secrets.S3_PRODUCTION_TEMPLATES }}

      staging-slack-webhook: ${{ secrets.STAGING_SLACK_WEBHOOK_URL }}
      production-slack-webhook: ${{ secrets.PRODUCTION_SLACK_WEBHOOK_URL }}
